<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberShop Premium | Login</title>
    <style>
        body {
            background-color: #121214; /* Cinza Grafite Profundo */
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: #202024;
            padding: 40px;
            border-radius: 10px;
            width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #29292e;
            text-align: center;
        }

        .titulo-login {
            font-size: 2rem;
            color: #00F5D4; /* Nosso Verde Neon */
            margin-bottom: 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .campo-grupo {
            text-align: left;
            margin-bottom: 20px;
        }

        .campo-grupo label {
            display: block;
            color: #A8A8B3;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .campo-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 5px;
            border: 2px solid #29292e;
            background-color: #121214;
            color: #FFFFFF;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .campo-input:focus {
            outline: none;
            border-color: #00F5D4;
        }

        .botao-entrar {
            width: 100%;
            background-color: #00F5D4;
            color: #121214;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .botao-entrar:hover {
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.6);
            transform: scale(1.02);
        }

        .link-alternativo, .link-voltar {
            display: block;
            color: #A8A8B3;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .link-alternativo { margin-top: 20px; margin-bottom: 10px; }
        .link-alternativo:hover, .link-voltar:hover { color: #00F5D4; }

        /* Alerta de erro vermelho com estilo neon */
        .mensagem-erro {
            background-color: rgba(255, 107, 107, 0.1);
            color: #FF6B6B;
            border: 1px solid #FF6B6B;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="titulo-login">Acessar Trono 🔐</h2>

        <!-- ⚠️ SEGUNDO ALERTA: Exibe o erro se as credenciais estiverem erradas -->
        {% if erro %}
            <div class="mensagem-erro">{{ erro }}</div>
        {% endif %}

        <!-- 🔑 MUDANÇA ESSENCIAL: Método POST para enviar dados ocultos com segurança -->
        <form method="POST" action="/login/">
            {% csrf_token %} <!-- 🛡️ ESCUDO PROTETOR CONTRA HACKERS DO DJANGO -->

            <div class="campo-grupo">
                <label for="username">Nome de Usuário</label>
                <!-- O segredo está no name="username" -->
                <input type="text" id="username" name="username" class="campo-input" placeholder="Seu usuário (Ex: maria)" required>
            </div>

            <div class="campo-grupo">
                <label for="senha">Senha Secreta</label>
                <!-- O segredo está no name="password" -->
                <input type="password" id="senha" name="password" class="campo-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="botao-entrar">Entrar</button>
        </form>

        <a href="/cadastro/" class="link-alternativo">Não tem uma conta? Cadastre-se aqui</a>
        <a href="/" class="link-voltar">← Voltar para a entrada</a>
    </div>

</body>
</html>
