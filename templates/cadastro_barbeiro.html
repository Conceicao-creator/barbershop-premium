<!-- suppress CssUnusedSymbol -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberShop Imperial | Credenciamento Real</title>
    <style>
        body {
            background-color: #121214;
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card-credenciamento {
            background-color: #202024;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #29292e;
            text-align: center;
        }
        .titulo-neon {
            font-size: 1.8rem;
            color: #00F5D4;
            margin: 0 0 8px 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .subtitulo {
            color: #A8A8B3;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .campo-grupo {
            margin-bottom: 18px;
            text-align: left;
        }
        .campo-input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 5px;
            border: 1px solid #29292e;
            background-color: #121214;
            color: #FFFFFF;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        .campo-input:focus {
            outline: none;
            border-color: #00F5D4;
        }
        .botao-cadastrar {
            width: 100%;
            background-color: #00F5D4;
            color: #121214;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s ease;
        }
        .botao-cadastrar:hover {
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.6);
        }
        .alerta-sucesso {
            background-color: rgba(0, 245, 212, 0.1);
            color: #00F5D4;
            border: 1px solid #00F5D4;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 18px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .alerta-erro {
            background-color: rgba(255, 107, 107, 0.1);
            color: #FF6B6B;
            border: 1px solid #FF6B6B;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .link-voltar {
            display: block;
            margin-top: 22px;
            color: #A8A8B3;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .link-voltar:hover { color: #00F5D4; }
    </style>
</head>
<body>

    <div class="card-credenciamento">
        <h2 class="titulo-neon">Credenciamento Real 🪒</h2>
        <p class="subtitulo">Cadastrar novo profissional na rede</p>

        {% if msg_sucesso %}
            <div class="alerta-sucesso">{{ msg_sucesso }}</div>
        {% endif %}
        {% if msg_erro %}
            <div class="alerta-erro">{{ msg_erro }}</div>
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}

            <div class="campo-grupo">
                <input type="text" name="username" class="campo-input" placeholder="Ex: gabriel.barber" autocomplete="off" required>
            </div>

            <div class="campo-grupo">
                <input type="text" name="first_name" class="campo-input" placeholder="Ex: Gabriel Master" autocomplete="off" required>
            </div>

            <div class="campo-grupo">
                <input type="password" name="password" class="campo-input" placeholder="Crie a senha do profissional" autocomplete="new-password" required>
            </div>


            <button type="submit" class="botao-cadastrar">Credenciar Profissional</button>
        </form>

        <a href="/central-lucros/" class="link-voltar">← Voltar para a Central Financeira</a>
    </div>

</body>
</html>
